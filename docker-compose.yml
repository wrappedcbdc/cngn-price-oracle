version: '3.8'

services:
  cngn-oracle-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cngn-oracle-api
    ports:
      - "3000:3000"
    environment:
      - ORACLE_CONTRACT_ADDRESS=${ORACLE_CONTRACT_ADDRESS:-0xdfbb5Cbc88E382de007bfe6CE99C388176ED80aD}
      - RPC_URL=${RPC_URL:-https://mainnet.base.org}
      - POLLING_INTERVAL=${POLLING_INTERVAL:-30000}
      - API_PORT=${API_PORT:-3000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  cngn-oracle-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cngn-oracle-monitor
    environment:
      - ORACLE_CONTRACT_ADDRESS=${ORACLE_CONTRACT_ADDRESS:-0xdfbb5Cbc88E382de007bfe6CE99C388176ED80aD}
      - RPC_URL=${RPC_URL:-https://mainnet.base.org}
      - POLLING_INTERVAL=${POLLING_INTERVAL:-30000}
    command: ["npm", "start"]
    restart: unless-stopped
